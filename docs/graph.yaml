schema_version: 1
graph_revision: 6
updated_at: "2026-08-19"

entrypoints:
  human: root-readme
  agent: agent-contract
  internal: docs-index

documents:
  - id: root-readme
    path: README.md
    type: entrypoint
    status: active
    scope: repository
    authority: orientation
    read_when: [first-entry]

  - id: agent-contract
    path: AGENTS.md
    type: agent-instructions
    status: active
    scope: repository
    authority: operating-contract
    read_when: [any-agent-task]

  - id: moye-task-control-skill
    path: .agents/skills/moye-task-control/SKILL.md
    type: agent-skill
    status: active
    scope: repository
    authority: operating-procedure
    read_when: [any-agent-task, task-execution, task-close]

  - id: docs-index
    path: docs/README.md
    type: index
    status: active
    scope: documentation
    authority: documentation-governance
    read_when: [any-agent-task, docs-change]

  - id: sources-index
    path: docs/sources/README.md
    type: index
    status: active
    scope: sources
    authority: navigation
    read_when: [source-intake, requirement-discovery]

  - id: delivery-index
    path: docs/delivery/README.md
    type: index
    status: active
    scope: delivery
    authority: navigation
    read_when: [backlog-triage, task-create, task-archive]

  - id: knowledge-index
    path: docs/knowledge/README.md
    type: index
    status: active
    scope: knowledge
    authority: navigation
    read_when: [any-agent-task, knowledge-change]

  - id: meta-index
    path: docs/meta/README.md
    type: index
    status: active
    scope: documentation-control
    authority: documentation-governance
    read_when: [docs-change]

  - id: architecture-index
    path: docs/knowledge/current/architecture/README.md
    type: index
    status: active
    scope: architecture
    authority: navigation
    read_when: [architecture-change]

  - id: architecture-overview
    path: docs/knowledge/current/architecture/overview.md
    type: architecture
    status: draft
    scope: system
    authority: current-design
    read_when: [first-entry, architecture-change, cross-domain-change]

  - id: task-runtime-kernel
    path: docs/knowledge/current/architecture/task-runtime-kernel.md
    type: detailed-design
    status: draft
    scope: task-runtime
    authority: current-design
    read_when: [task-runtime-change, workflow-change, retry-change]

  - id: document-control-plane
    path: docs/knowledge/current/architecture/document-control-plane.md
    type: detailed-design
    status: draft
    scope: documentation-control
    authority: current-design
    read_when: [any-agent-task, docs-change, task-closure-change]

  - id: restate-poc-architecture
    path: docs/knowledge/current/architecture/poc-01-restate.md
    type: architecture
    status: proposed
    scope: restate-poc
    authority: current-design
    read_when: [restate-poc-change]

  - id: adr-index
    path: docs/knowledge/decisions/adr/README.md
    type: index
    status: active
    scope: decisions
    authority: navigation
    read_when: [architecture-change, dependency-change]

  - id: adr-template
    path: docs/knowledge/decisions/adr/template.md
    type: template
    status: active
    scope: decisions
    authority: template
    read_when: [new-adr]

  - id: adr-0001-restate-poc
    path: docs/knowledge/decisions/adr/0001-use-restate-for-task-runtime-poc.md
    type: adr
    status: accepted
    scope: restate-poc
    authority: accepted-decision
    read_when: [restate-poc-change, workflow-change]

  - id: adr-0002-doc-lifecycle-roles
    path: docs/knowledge/decisions/adr/0002-organize-docs-by-lifecycle-role.md
    type: adr
    status: accepted
    scope: documentation-control
    authority: accepted-decision
    read_when: [docs-change, task-archive, backlog-triage]

  - id: research-index
    path: docs/sources/research/README.md
    type: index
    status: active
    scope: research
    authority: navigation
    read_when: [research-change]

  - id: brainstorm-index
    path: docs/sources/brainstorm/README.md
    type: index
    status: active
    scope: brainstorm
    authority: navigation
    read_when: [brainstorm-change, requirement-discovery]

  - id: task-spec-document-closure-brainstorm
    path: docs/sources/brainstorm/task-spec-and-document-closure.md
    type: brainstorm
    status: draft
    scope: task-spec-and-document-closure
    authority: idea-input
    read_when: [task-lifecycle-design, spec-lifecycle-design, docs-change]

  - id: durable-workflow-research
    path: docs/sources/research/durable-workflow-and-observability-options.md
    type: research
    status: draft
    scope: workflow-and-observability
    authority: analysis
    read_when: [workflow-selection, observability-selection]

  - id: pitfalls-index
    path: docs/knowledge/guidance/pitfalls/README.md
    type: index
    status: active
    scope: pitfalls
    authority: navigation
    read_when: [any-agent-task]

  - id: durable-runtime-pitfalls
    path: docs/knowledge/guidance/pitfalls/durable-task-runtime.md
    type: pitfalls
    status: active
    scope: task-runtime
    authority: known-risk
    read_when: [task-runtime-change, workflow-change, scm-change]

  - id: incidents-index
    path: docs/sources/incidents/README.md
    type: index
    status: active
    scope: incidents
    authority: navigation
    read_when: [incident-response]

  - id: incident-template
    path: docs/sources/incidents/template.md
    type: template
    status: active
    scope: incidents
    authority: template
    read_when: [new-incident]

  - id: runbooks-index
    path: docs/knowledge/guidance/runbooks/README.md
    type: index
    status: active
    scope: operations
    authority: operational-procedure
    read_when: [operations-change, incident-response]

  - id: local-restate-poc-runbook
    path: docs/knowledge/guidance/runbooks/local-restate-poc.md
    type: runbook
    status: verified
    scope: restate-poc
    authority: operational-procedure
    read_when: [restate-poc, operations-change, incident-response]

  - id: codemap
    path: docs/knowledge/current/codemap/README.md
    type: codemap
    status: active
    scope: repository
    authority: code-navigation
    read_when: [any-agent-task, code-structure-change]

  - id: findings-index
    path: docs/sources/findings/README.md
    type: index
    status: active
    scope: findings
    authority: navigation
    read_when: [finding-intake, bug-intake]

  - id: references-index
    path: docs/sources/references/README.md
    type: index
    status: active
    scope: references
    authority: navigation
    read_when: [research-change, reference-intake]

  - id: backlog-index
    path: docs/delivery/backlog/README.md
    type: index
    status: active
    scope: backlog
    authority: backlog-governance
    read_when: [source-intake, backlog-triage, task-create]

  - id: tasks-index
    path: docs/delivery/tasks/README.md
    type: index
    status: active
    scope: tasks
    authority: task-artifact-governance
    read_when: [task-create, task-execution, task-close, task-archive]

  - id: archived-tasks-index
    path: docs/delivery/tasks/archive/README.md
    type: index
    status: active
    scope: task-archive
    authority: archive-policy
    read_when: [task-archive, task-audit]

  - id: bl-0001-runtime-board
    path: docs/delivery/backlog/BL-0001.yaml
    type: backlog
    status: converted_to_task
    scope: task-runtime-and-board
    authority: backlog
    read_when: [task-create, restate-poc]

  - id: task-0001-manifest
    path: docs/delivery/tasks/archive/2026-08-20-TASK-0001/task.yaml
    type: task-manifest
    status: archived
    scope: task-runtime-and-board
    authority: task-artifact
    read_when: [restate-poc, task-execution, task-close]

  - id: task-0001-spec
    path: docs/delivery/tasks/archive/2026-08-20-TASK-0001/spec.md
    type: task-spec
    status: archived
    scope: task-runtime-and-board
    authority: task-artifact
    read_when: [restate-poc, task-execution, task-close]

  - id: task-0001-design
    path: docs/delivery/tasks/archive/2026-08-20-TASK-0001/design.md
    type: task-design
    status: archived
    scope: task-runtime-and-board
    authority: task-artifact
    read_when: [restate-poc, task-execution]

  - id: task-0001-plan
    path: docs/delivery/tasks/archive/2026-08-20-TASK-0001/plan.md
    type: task-plan
    status: archived
    scope: task-runtime-and-board
    authority: task-artifact
    read_when: [restate-poc, task-execution]

  - id: task-0001-verification
    path: docs/delivery/tasks/archive/2026-08-20-TASK-0001/verification.md
    type: verification
    status: archived
    scope: task-runtime-and-board
    authority: task-evidence
    read_when: [task-close, task-archive]

  - id: task-0001-docs-impact
    path: docs/delivery/tasks/archive/2026-08-20-TASK-0001/docs-impact.yaml
    type: docs-impact
    status: archived
    scope: task-runtime-and-board
    authority: task-evidence
    read_when: [task-close, task-archive]

  - id: restate-typescript-baseline
    path: docs/sources/research/restate-typescript-implementation-baseline.md
    type: research
    status: current
    scope: restate-poc
    authority: analysis
    read_when: [restate-poc, dependency-change]

  - id: adr-0003-typescript-poc
    path: docs/knowledge/decisions/adr/0003-use-typescript-for-restate-poc.md
    type: adr
    status: accepted
    scope: restate-poc
    authority: accepted-decision
    read_when: [restate-poc, dependency-change]

