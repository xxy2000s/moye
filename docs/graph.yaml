routing:
  baseline:
    - agent-contract
    - docs-index
    - codemap
    - document-control-plane

  intents:
    first-entry:
      - root-readme
      - architecture-overview
    any-agent-task:
      - document-control-plane
      - pitfalls-index
    restate-poc:
      - adr-0001-restate-poc
      - restate-poc-architecture
      - task-runtime-kernel
      - durable-runtime-pitfalls
    task-runtime-change:
      - task-runtime-kernel
      - durable-runtime-pitfalls
    workflow-selection:
      - durable-workflow-research
      - adr-index
    docs-change:
      - document-control-plane
      - docs-index
      - meta-index
      - adr-0002-doc-lifecycle-roles
    source-intake:
      - sources-index
      - backlog-index
    finding-intake:
      - findings-index
      - backlog-index
    reference-intake:
      - references-index
      - research-index
    backlog-triage:
      - backlog-index
      - sources-index
    task-create:
      - backlog-index
      - tasks-index
      - task-runtime-kernel
    task-archive:
      - tasks-index
      - archived-tasks-index
      - task-runtime-kernel
      - document-control-plane
    brainstorm-consumption:
      - brainstorm-index
      - task-spec-document-closure-brainstorm
      - document-control-plane
    incident-response:
      - incidents-index
      - backlog-index
      - runbooks-index
      - pitfalls-index

  path_rules:
    - match: "docs/**"
      read: [document-control-plane]
      review: [docs-index]
    - match: "docs/sources/**"
      read: [sources-index]
      review: [backlog-index]
    - match: "docs/sources/brainstorm/**"
      read: [brainstorm-index]
      review: [research-index, document-control-plane]
    - match: "docs/sources/findings/**"
      read: [findings-index]
      review: [backlog-index]
    - match: "docs/sources/incidents/**"
      read: [incidents-index]
      review: [backlog-index, pitfalls-index, runbooks-index]
    - match: "docs/sources/research/**"
      read: [research-index, references-index]
      review: [adr-index]
    - match: "docs/sources/references/**"
      read: [references-index]
      review: [research-index]
    - match: "docs/delivery/backlog/**"
      read: [backlog-index, sources-index]
      review: [tasks-index, document-control-plane]
    - match: "docs/delivery/tasks/archive/**"
      read: [archived-tasks-index, tasks-index, task-runtime-kernel]
      review: [document-control-plane, codemap]
    - match: "docs/delivery/tasks/**"
      read: [tasks-index, task-runtime-kernel]
      review: [document-control-plane, codemap]
    - match: "docs/knowledge/current/architecture/**"
      read: [architecture-index]
      review: [architecture-overview, codemap]
    - match: "docs/knowledge/current/codemap/**"
      read: [codemap]
      review: [architecture-overview]
    - match: "docs/knowledge/decisions/adr/**"
      read: [adr-index]
      review: [architecture-overview]
    - match: "docs/knowledge/guidance/pitfalls/**"
      read: [pitfalls-index]
      review: [task-runtime-kernel]
    - match: "docs/knowledge/guidance/runbooks/**"
      read: [runbooks-index]
      review: [task-runtime-kernel]
    - match: "docs/meta/**"
      read: [meta-index, document-control-plane]
      review: [docs-index]
    - match: "src/domain/**"
      read: [task-runtime-kernel]
      review: [codemap, architecture-overview]
    - match: "src/restate/**"
      read: [task-runtime-kernel, restate-poc-architecture, adr-0001-restate-poc]
      review: [codemap, durable-runtime-pitfalls]
    - match: "src/archive/**"
      read: [task-runtime-kernel]
      review: [codemap, durable-runtime-pitfalls]
    - match: "src/effects/**"
      read: [task-runtime-kernel, durable-runtime-pitfalls]
      review: [codemap]
    - match: "src/board/**"
      read: [restate-poc-architecture]
      review: [codemap, architecture-overview]
    - match: "src/cli/**"
      read: [document-control-plane, restate-poc-architecture]
      review: [codemap, agent-contract]
    - match: "public/**"
      read: [restate-poc-architecture]
      review: [codemap]
    - match: ".agents/skills/**"
      read: [agent-contract, document-control-plane]
      review: [codemap, docs-index]
    - match: "tests/e2e/**"
      read: [task-runtime-kernel, restate-poc-architecture, durable-runtime-pitfalls]
      review: [codemap, local-restate-poc-runbook]
    - match: "tests/unit/**"
      read: [task-runtime-kernel]
      review: [codemap]

  propagating_relations:
    - refines
    - integrates_with
    - implements_slice_of
    - governs
    - informs
    - warns_about
    - maps_implementation_of
    - enforces

impact_policy:
  required_disposition: [updated, unchanged, not_applicable]
  unchanged_requires_reason: true
  not_applicable_requires_reason: true
  new_markdown_must_be_registered: true
  every_non_index_document_requires_relation: true
