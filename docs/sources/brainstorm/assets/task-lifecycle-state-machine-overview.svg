<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3f3a32" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#514b43"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#3c6e91"/>
    </marker>
    <style>
      .title{font:700 36px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#25221e}
      .subtitle{font:400 18px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#665e55}
      .section{font:700 23px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#302c27}
      .hint{font:400 14px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#665e55}
      .node-title{font:700 17px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#292621;text-anchor:middle}
      .node-sub{font:400 13px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#5f574f;text-anchor:middle}
      .num{font:700 16px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff;text-anchor:middle}
      .label{font:600 13px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#514b43;text-anchor:middle}
      .small{font:400 12px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#645c53}
      .current{fill:#dcecdf;stroke:#4d7657;stroke-width:2}
      .target{fill:#fff0cb;stroke:#a36f1f;stroke-width:2;stroke-dasharray:7 4}
      .neutral{fill:#f4eee5;stroke:#8d8175;stroke-width:2}
      .error{fill:#f6dddd;stroke:#a85c5c;stroke-width:2}
      .terminal{fill:#e8e0f2;stroke:#735b89;stroke-width:2}
      .restate{fill:#dcecf6;stroke:#3c6e91;stroke-width:2}
      .panel{fill:#fffdf8;stroke:#c8bdae;stroke-width:2}
      .blue-panel{fill:#eef6fb;stroke:#5f8ba7;stroke-width:2.5}
      .flow{fill:none;stroke:#514b43;stroke-width:2.4;marker-end:url(#arrow)}
      .blue-flow{fill:none;stroke:#3c6e91;stroke-width:2.2;marker-end:url(#arrowBlue)}
    </style>
  </defs>

  <rect width="2400" height="1500" fill="#f7f3eb"/>
  <text x="55" y="62" class="title">Moye：一个编码任务怎样真正闭环（看懂版）</text>
  <text x="55" y="95" class="subtitle">Moye 决定“下一步做什么”；Restate 保证“流程不丢、进程挂了还能继续”。</text>

  <g transform="translate(1710,38)">
    <rect width="630" height="70" rx="14" fill="#fffdf8" stroke="#d2c8bb"/>
    <rect x="20" y="17" width="27" height="18" rx="4" class="current"/><text x="58" y="31" class="small">当前已有基础</text>
    <rect x="188" y="17" width="27" height="18" rx="4" class="target"/><text x="226" y="31" class="small">完整闭环待补</text>
    <rect x="365" y="17" width="27" height="18" rx="4" class="restate"/><text x="403" y="31" class="small">Restate 能力</text>
    <line x1="20" y1="53" x2="78" y2="53" class="flow"/><text x="90" y="57" class="small">唯一主线</text>
    <text x="240" y="57" class="small">异常不画跨屏回线，直接标注“回到第 N 步”</text>
  </g>

  <!-- Main line -->
  <rect x="40" y="135" width="2320" height="505" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="68" y="178" class="section">一、正常主线：只沿箭头从左往右看</text>
  <text x="68" y="207" class="hint">蓝色边框表示第 3～11 步整体运行在同一个 Restate CodingTaskWorkflow/&lt;task_id&gt; 中。</text>

  <g filter="url(#shadow)">
    <rect x="75" y="265" width="205" height="110" rx="15" class="neutral"/>
    <circle cx="102" cy="290" r="17" fill="#746b62"/><text x="102" y="296" class="num">1</text>
    <text x="178" y="305" class="node-title">需求进入</text>
    <text x="178" y="334" class="node-sub">Source → Backlog</text>
    <text x="178" y="357" class="node-sub">被调度为 Task</text>

    <rect x="315" y="255" width="230" height="130" rx="15" class="target"/>
    <circle cx="342" cy="282" r="17" fill="#a36f1f"/><text x="342" y="288" class="num">2</text>
    <text x="430" y="300" class="node-title">批准执行契约</text>
    <text x="430" y="329" class="node-sub">Task Package + Context Route</text>
    <text x="430" y="352" class="node-sub">冻结 TaskEnvelope / Base SHA</text>
    <text x="430" y="375" class="node-sub">统一正式入口仍待补</text>
  </g>

  <rect x="575" y="225" width="1745" height="375" rx="20" fill="#f5fbff" stroke="#5f8ba7" stroke-width="3"/>
  <rect x="605" y="242" width="520" height="39" rx="10" fill="#dcecf6" stroke="#5f8ba7"/>
  <text x="865" y="268" class="node-title">Restate 持久执行：CodingTaskWorkflow/&lt;task_id&gt;</text>

  <g filter="url(#shadow)">
    <rect x="620" y="305" width="190" height="110" rx="15" class="current"/>
    <circle cx="647" cy="330" r="17" fill="#4d7657"/><text x="647" y="336" class="num">3</text>
    <text x="715" y="345" class="node-title">准备上下文</text>
    <text x="715" y="374" class="node-sub">CONTEXT</text>
    <text x="715" y="397" class="node-sub">固定 Spec 与验证命令</text>

    <rect x="840" y="305" width="190" height="110" rx="15" class="current"/>
    <circle cx="867" cy="330" r="17" fill="#4d7657"/><text x="867" y="336" class="num">4</text>
    <text x="935" y="345" class="node-title">创建 Worktree</text>
    <text x="935" y="374" class="node-sub">WORKSPACE</text>
    <text x="935" y="397" class="node-sub">隔离分支与目录</text>

    <rect x="1060" y="305" width="190" height="110" rx="15" class="current"/>
    <circle cx="1087" cy="330" r="17" fill="#4d7657"/><text x="1087" y="336" class="num">5</text>
    <text x="1155" y="345" class="node-title">Agent 编码</text>
    <text x="1155" y="374" class="node-sub">IMPLEMENT · Attempt N</text>
    <text x="1155" y="397" class="node-sub">生成 Result Commit</text>

    <rect x="1280" y="305" width="190" height="110" rx="15" class="current"/>
    <circle cx="1307" cy="330" r="17" fill="#4d7657"/><text x="1307" y="336" class="num">6</text>
    <text x="1375" y="345" class="node-title">自动验证</text>
    <text x="1375" y="374" class="node-sub">VERIFY</text>
    <text x="1375" y="397" class="node-sub">证据绑定 Commit</text>

    <rect x="1500" y="305" width="190" height="110" rx="15" class="current"/>
    <circle cx="1527" cy="330" r="17" fill="#4d7657"/><text x="1527" y="336" class="num">7</text>
    <text x="1595" y="345" class="node-title">合入主干</text>
    <text x="1595" y="374" class="node-sub">MERGE</text>
    <text x="1595" y="397" class="node-sub">CAS + 丢回执对账</text>

    <rect x="1720" y="305" width="190" height="110" rx="15" class="target"/>
    <circle cx="1747" cy="330" r="17" fill="#a36f1f"/><text x="1747" y="336" class="num">8</text>
    <text x="1815" y="345" class="node-title">文档门禁</text>
    <text x="1815" y="374" class="node-sub">DOCS GATE</text>
    <text x="1815" y="397" class="node-sub">Route + Docs Impact</text>

    <rect x="1940" y="295" width="210" height="130" rx="15" class="target"/>
    <circle cx="1967" cy="322" r="17" fill="#a36f1f"/><text x="1967" y="328" class="num">9</text>
    <text x="2045" y="340" class="node-title">收束 Worktree</text>
    <text x="2045" y="369" class="node-sub">FINALIZE WORKSPACE</text>
    <text x="2045" y="392" class="node-sub">保存 / 删除 / 隔离</text>
    <text x="2045" y="414" class="node-sub">生成 Cleanup Receipt</text>

    <rect x="1720" y="470" width="230" height="95" rx="15" class="target"/>
    <circle cx="1747" cy="495" r="17" fill="#a36f1f"/><text x="1747" y="501" class="num">10</text>
    <text x="1845" y="505" class="node-title">Closure Gate</text>
    <text x="1845" y="531" class="node-sub">→ CLOSED（成功 / 失败 / 取消）</text>

    <rect x="2000" y="470" width="230" height="95" rx="15" class="current"/>
    <circle cx="2027" cy="495" r="17" fill="#4d7657"/><text x="2027" y="501" class="num">11</text>
    <text x="2115" y="509" class="node-title">独立归档</text>
    <text x="2115" y="538" class="node-sub">ARCHIVED / FAILED</text>
  </g>

  <path d="M280 320 H315" class="flow"/><path d="M545 320 H620" class="flow"/>
  <path d="M810 360 H840" class="flow"/><path d="M1030 360 H1060" class="flow"/>
  <path d="M1250 360 H1280" class="flow"/><path d="M1470 360 H1500" class="flow"/>
  <path d="M1690 360 H1720" class="flow"/><path d="M1910 360 H1940" class="flow"/>
  <path d="M2045 425 V447 H1835 V470" class="flow"/>
  <path d="M1950 518 H2000" class="flow"/>
  <text x="1175" y="458" class="label">验证没过、结果未知、Agent 失败或取消时，先看下面的异常规则；最终都必须回到第 9 步收束。</text>

  <!-- Exception rules -->
  <rect x="40" y="675" width="2320" height="360" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="68" y="718" class="section">二、异常怎么走：不画回路线，直接告诉你回到哪一步</text>

  <g filter="url(#shadow)">
    <rect x="75" y="765" width="225" height="100" rx="15" class="error"/>
    <text x="188" y="800" class="node-title">A. 验证没过</text>
    <text x="188" y="829" class="node-sub">先判断失败性质</text>
    <text x="188" y="850" class="node-sub">不是直接无限重试</text>

    <rect x="345" y="755" width="260" height="120" rx="15" class="target"/>
    <text x="475" y="790" class="node-title">可以修代码：Repair</text>
    <text x="475" y="819" class="node-sub">记录 Finding</text>
    <text x="475" y="842" class="node-sub">创建 Attempt N+1</text>
    <text x="475" y="864" class="node-sub">↩ 回到第 5 步 Agent 编码</text>

    <rect x="650" y="755" width="260" height="120" rx="15" class="target"/>
    <text x="780" y="790" class="node-title">方案有问题：Replan</text>
    <text x="780" y="819" class="node-sub">新 Plan / Spec Revision</text>
    <text x="780" y="842" class="node-sub">旧证据显式失效</text>
    <text x="780" y="864" class="node-sub">↩ 回到第 3 步准备上下文</text>

    <rect x="955" y="755" width="260" height="120" rx="15" class="error"/>
    <text x="1085" y="790" class="node-title">预算耗尽：终止</text>
    <text x="1085" y="819" class="node-sub">FAILED_TERMINAL</text>
    <text x="1085" y="842" class="node-sub">保留失败证据</text>
    <text x="1085" y="864" class="node-sub">→ 去第 9 步收束 Worktree</text>

    <rect x="1280" y="755" width="260" height="120" rx="15" class="target"/>
    <text x="1410" y="790" class="node-title">B. 结果未知</text>
    <text x="1410" y="819" class="node-sub">停止盲目重跑</text>
    <text x="1410" y="842" class="node-sub">Intent + Artifact + Git 对账</text>
    <text x="1410" y="864" class="node-sub">确认后从原步骤继续</text>

    <rect x="1585" y="755" width="260" height="120" rx="15" class="target"/>
    <text x="1715" y="790" class="node-title">C. Agent 明确失败</text>
    <text x="1715" y="819" class="node-sub">本 Attempt 进入 FAILED</text>
    <text x="1715" y="842" class="node-sub">由 Retry Policy 决定</text>
    <text x="1715" y="864" class="node-sub">新 Attempt 或终止收束</text>

    <rect x="1890" y="755" width="260" height="120" rx="15" class="target"/>
    <text x="2020" y="790" class="node-title">D. 用户取消</text>
    <text x="2020" y="819" class="node-sub">停止派发新 Attempt</text>
    <text x="2020" y="842" class="node-sub">保存 Commit / Patch / Artifact</text>
    <text x="2020" y="864" class="node-sub">→ 去第 9 步收束 Worktree</text>
  </g>

  <path d="M300 815 H320 V738 H1085" fill="none" stroke="#514b43" stroke-width="2.2"/>
  <path d="M475 738 V755" class="flow"/>
  <path d="M780 738 V755" class="flow"/>
  <path d="M1085 738 V755" class="flow"/>
  <text x="1115" y="940" class="label">统一出口：SUCCEEDED / FAILED_TERMINAL / CANCELLED → 第 9 步 Workspace Finalize → 第 10 步 Closure Gate → 第 11 步 Archive</text>
  <rect x="180" y="965" width="2040" height="42" rx="12" fill="#eee7f5" stroke="#88719a"/>
  <text x="1200" y="992" class="label">Attempt 规则：SCHEDULED → RUNNING → SUCCEEDED / FAILED / CANCELLED；重试永远创建 N+1，不复活旧 Attempt。</text>

  <!-- Restate explanation -->
  <rect x="40" y="1070" width="2320" height="375" rx="22" class="blue-panel" filter="url(#shadow)"/>
  <text x="68" y="1113" class="section">三、Restate 到底管什么？——它托住整条流程，但不替 Moye 做业务决定</text>
  <text x="68" y="1142" class="hint">上面蓝色边框里的第 3～11 步，都由 Restate 持久执行。下面五件事是 Restate 的核心价值。</text>

  <g filter="url(#shadow)">
    <rect x="75" y="1185" width="390" height="105" rx="15" class="restate"/>
    <text x="270" y="1218" class="node-title">① 一个 Task，一个 Workflow</text>
    <text x="270" y="1247" class="node-sub">task_id 是唯一 Key，重复提交不会开第二条生命周期</text>
    <text x="270" y="1270" class="node-sub">TaskAuthority 冻结 owner + spec_revision</text>

    <rect x="520" y="1185" width="390" height="105" rx="15" class="restate"/>
    <text x="715" y="1218" class="node-title">② Journal 记录走到哪里</text>
    <text x="715" y="1247" class="node-sub">已经确认的 Step 和调用结果被持久记录</text>
    <text x="715" y="1270" class="node-sub">Moye 进程重启后不用从头跑</text>

    <rect x="965" y="1185" width="390" height="105" rx="15" class="restate"/>
    <text x="1160" y="1218" class="node-title">③ ctx.run 执行 Durable Operation</text>
    <text x="1160" y="1247" class="node-sub">基础设施错误可有界重试；Git / Agent 等仍需幂等或对账</text>
    <text x="1160" y="1270" class="node-sub">Operation Retry 不等于 Repair / Replan</text>

    <rect x="1410" y="1185" width="390" height="105" rx="15" class="restate"/>
    <text x="1605" y="1218" class="node-title">④ Worker 挂了可以接着跑</text>
    <text x="1605" y="1247" class="node-sub">进程退出不是业务失败；新 Worker 从 Journal 恢复</text>
    <text x="1605" y="1270" class="node-sub">外部结果未知时仍然进入 Reconcile</text>

    <rect x="1855" y="1185" width="430" height="105" rx="15" class="restate"/>
    <text x="2070" y="1218" class="node-title">⑤ State / Timer / Signal / 查询</text>
    <text x="2070" y="1247" class="node-sub">保存 Projection，支持等待、退避、人工 Gate 和状态查询</text>
    <text x="2070" y="1270" class="node-sub">Admin UI / Trace 只负责诊断，不推进业务状态</text>
  </g>

  <text x="75" y="1340" class="section">一次 Worker 中断会发生什么</text>
  <g>
    <rect x="75" y="1360" width="290" height="55" rx="12" class="current"/><text x="220" y="1394" class="node-title">Agent / Verify 正在执行</text>
    <rect x="445" y="1360" width="290" height="55" rx="12" class="error"/><text x="590" y="1394" class="node-title">Moye Worker 被杀</text>
    <rect x="815" y="1360" width="340" height="55" rx="12" class="restate"/><text x="985" y="1394" class="node-title">Restate Journal 仍然存在</text>
    <rect x="1235" y="1360" width="340" height="55" rx="12" class="restate"/><text x="1405" y="1394" class="node-title">新 Worker 连接并 Replay</text>
    <rect x="1655" y="1352" width="590" height="70" rx="12" class="target"/><text x="1950" y="1382" class="node-title">已确认的步骤不重跑</text><text x="1950" y="1407" class="node-sub">未确认的外部副作用先 Reconcile，再决定继续或停止</text>
  </g>
  <path d="M365 1388 H445" class="blue-flow"/><path d="M735 1388 H815" class="blue-flow"/>
  <path d="M1155 1388 H1235" class="blue-flow"/><path d="M1575 1388 H1655" class="blue-flow"/>

  <text x="55" y="1480" class="subtitle">一句话：Restate 让 Moye 的状态机可靠运行；Repair、Replan、Worktree 收束和关闭条件仍由 Moye 定义。</text>
</svg>
