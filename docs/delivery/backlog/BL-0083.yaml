schema_version: 2
id: BL-0083
title: "区分 Agent Session 内容完整性与 Prompt 绑定可信度"
kind: bug
status: triaged
priority: medium

problem:
  observed: "Board 把历史 Enrichment 的 promptBinding=UNVERIFIED 与内容缺口合并为 PARTIAL，并统一提示记录不完整；实际消息、时间、层级和 Parser 指标可能完整可读。"
  expected: "页面分别展示 Evidence 可用性、内容完整性、Prompt/Attempt 绑定可信度和策略/Provider 限制；历史正文可读但强绑定不可追溯时只说明 UNVERIFIED。"
  impact: "用户会把可信度限制误判为 Transcript 丢失，无法区分真正解析/截断缺口与历史任务未冻结 Prompt Envelope 的可审计边界。"
  evidence_refs:
    - "TASK-0064"
    - "TASK-0076"
    - "adr-0007-session-transcript-sidecar"
    - "/api/tasks/<task_id>/roles/<run_id>/session"
source_refs: []
affected_areas:
  - board-agent-session
  - session-evidence
  - transcript-schema
acceptance_outline:
  - "Board 将会话可读性、内容完整性与 Prompt/Attempt 绑定可信度分层展示，不再把所有 PARTIAL 统一描述为记录不完整"
  - "HISTORICAL_ENRICHMENT + UNVERIFIED 且消息、时间、层级和解析指标无缺口时，明确显示历史会话可读、仅 Prompt 强绑定无法追溯验证"
  - "真正的解析、丢弃、未知事件、终止标记或内容维度缺口继续显示 PARTIAL，并逐项列出缺失原因"
  - "OMITTED_BY_POLICY、NOT_EXPOSED 等策略或 Provider 能力边界不得被误报为数据丢失"
  - "PENDING、WAITING_RECONCILE、UNAVAILABLE、FAILED 与 Artifact 完整性错误保持独立状态和操作建议"
  - "旧 Receipt、Manifest、Projection 和 Digest 不回写；原始 PARTIAL/UNVERIFIED 事实继续在高级诊断可见"
  - "评估以版本化 PROMPT_BINDING_UNVERIFIED/BINDING 语义替代新 Evidence 中误导性的 UNSUPPORTED_FORMAT/PARSER，同时兼容既有封存 Evidence"
resolution:
