schema_version: 2
id: "BL-0005"
title: "接入远程 Git Provider 与 PR/Merge 闭环"
kind: "feature"
status: "triaged"
priority: "medium"

problem:
  observed: "当前 Git Effect 只在本地仓库创建 Candidate、双父 Merge 和 ref CAS；没有远程 Provider Push、PR、Review 状态或 Merge API 回执。"
  expected: "可替换 SCM Adapter 以稳定幂等键执行并对账 Push/PR/Merge，网络未知结果先查询远端事实，Base 漂移后重新验证。"
  impact: "Moye 尚不能在 GitHub/GitLab 等远程协作流程中形成可审计的 PR 到 Merge 闭环，也不能安全处理远端超时和重复投递。"
  evidence_refs:
    - "TASK-0041"
    - "framework-product-boundary"
    - "BL-0005"

source_refs:
  - task-spec-document-closure-brainstorm
affected_areas:
  - scm-adapter
  - git-provider
  - pull-request
  - merge
  - effect-ledger

acceptance_outline:
  - "通过可替换 SCM Adapter 接入 Push、PR、Review 状态和 Merge"
  - "所有远程写操作具有稳定幂等键、请求摘要和外部引用"
  - "网络超时导致结果未知时先查询远端状态，再决定确认或重试"
  - "Base Branch 漂移后重新验证，不把过期结果直接合入"
  - "Task 记录 Branch、Head SHA、PR、Merge SHA 和对应业务事件"

