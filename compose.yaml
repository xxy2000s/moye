name: moye

services:
  restate:
    image: docker.restate.dev/restatedev/restate:1.7.4
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9070:9070"
    volumes:
      - restate_data:/restate-data
    restart: unless-stopped

  phoenix:
    profiles: ["trace"]
    image: arizephoenix/phoenix:version-19.10.0
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "7"
    volumes:
      - phoenix_data:/mnt/data
    restart: unless-stopped

volumes:
  restate_data:
  phoenix_data:
