schemaVersion: 1
project: { id: minimal-git-example }
repository: { root: ., baseRef: HEAD, targetRef: refs/heads/main }
workflow: { profile: core-v2, repairBudget: 1, replanBudget: 1 }
agent: { runner: codex, captureTranscripts: none }
tests:
  - id: git-integrity
    argv: [git, diff, --check, HEAD]
    cwd: .
documentation: { policy: none }
artifacts: { root: .moye/artifacts }
privacy: { capturePrompts: false }
